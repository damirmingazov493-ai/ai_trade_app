<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Trading Terminal</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Более надежный CDN для графиков -->
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { background: radial-gradient(circle at top, #0a1128 0%, #030614 100%); color: #ffffff; font-family: sans-serif; }
        .neon-border { border: 1px solid rgba(0, 240, 255, 0.3); box-shadow: 0 0 15px rgba(0, 240, 255, 0.1); background: rgba(10, 17, 40, 0.6); }
        #chart-container { width: 100%; height: 300px; }
    </style>
</head>
<body class="p-4">

    <h1 class="text-3xl font-extrabold neon-text mb-4">ТЕСТ ГРАФИКА</h1>

    <div class="neon-border rounded-3xl p-4 mb-6">
        <div class="text-xs text-cyan-300 mb-2" id="chart-status">Инициализация...</div>
        <div id="chart-container" class="rounded-xl overflow-hidden"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.ready(); 

        const statusEl = document.getElementById('chart-status');
        statusEl.innerText = "Библиотека загружена. Рисуем...";

        try {
            const chartContainer = document.getElementById('chart-container');
            const chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: 300,
                layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#00f0ff' },
                grid: { vertLines: { color: 'rgba(0, 240, 255, 0.05)' }, horzLines: { color: 'rgba(0, 240, 255, 0.05)' } },
            });

            const candleSeries = chart.addCandlestickSeries({
                upColor: '#00ff88', downColor: '#ff3366', borderVisible: false, wickUpColor: '#00ff88', wickDownColor: '#ff3366',
            });

            // ГЕНЕРИРУЕМ 50 ТЕСТОВЫХ СВЕЧЕЙ ПРЯМО В БРАУЗЕРЕ
            const mockData = [];
            let basePrice = 64000;
            let time = Math.floor(Date.now() / 1000) - 50 * 3600; // 50 часов назад
            
            for (let i = 0; i < 50; i++) {
                let open = basePrice;
                let close = open + (Math.random() - 0.5) * 1000;
                let high = Math.max(open, close) + Math.random() * 500;
                let low = Math.min(open, close) - Math.random() * 500;
                
                mockData.push({ time: time, open: open, high: high, low: low, close: close });
                time += 3600; // +1 час
                basePrice = close;
            }

            candleSeries.setData(mockData);
            statusEl.innerText = "✅ График успешно отрисован (тест)";
            statusEl.className = "text-xs text-green-400 mb-2";

        } catch (error) {
            statusEl.innerText = "❌ ОШИБКА БИБЛИОТЕКИ: " + error.message;
            statusEl.className = "text-xs text-red-500 mb-2 font-bold";
        }
    </script>
</body>
</html>
