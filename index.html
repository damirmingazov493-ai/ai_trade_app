<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Trading Terminal</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { background: radial-gradient(circle at top, #0a1128 0%, #030614 100%); color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: 80px; }
        .neon-border { border: 1px solid rgba(0, 240, 255, 0.3); box-shadow: 0 0 15px rgba(0, 240, 255, 0.1), inset 0 0 10px rgba(0, 240, 255, 0.05); background: rgba(10, 17, 40, 0.6); backdrop-filter: blur(12px); }
        .neon-text { color: #00f0ff; text-shadow: 0 0 8px rgba(0, 240, 255, 0.5); }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(0, 240, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); } }
        .ai-pulse { animation: pulse-glow 2s infinite; }
        .time-btn { transition: all 0.2s; }
        .time-btn.active { background-color: #00f0ff; color: #030614; box-shadow: 0 0 10px rgba(0, 240, 255, 0.5); font-weight: bold; }
        .time-btn:not(.active) { background-color: rgba(0, 240, 255, 0.1); color: #00f0ff; }
        
        .coin-btn { transition: all 0.2s; border: 1px solid transparent; }
        .coin-btn.active { background-color: rgba(0, 240, 255, 0.15); border-color: #00f0ff; color: #00f0ff; font-weight: bold; }
        .coin-btn:not(.active) { background-color: rgba(255,255,255,0.05); color: #9ca3af; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        #chart-container { width: 100%; height: 300px; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 17, 40, 0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(0, 240, 255, 0.2); display: flex; justify-content: space-around; padding: 10px 0; z-index: 50; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #6b7280; font-size: 10px; transition: 0.3s; }
        .nav-item.active { color: #00f0ff; text-shadow: 0 0 8px rgba(0, 240, 255, 0.5); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4">

    <!-- ================= ВКЛАДКА 1: ТЕРМИНАЛ ================= -->
    <div id="view-terminal" class="tab-content active">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight neon-text" id="header-symbol">BTC / USD</h1>
                <div class="flex items-center space-x-2 mt-1">
                    <span class="text-green-400 text-lg font-bold" id="current-price">$--,---.--</span>
                </div>
            </div>
            <button onclick="goToCreateAlert()" class="w-12 h-12 bg-gray-800 rounded-full flex items-center justify-center text-2xl border border-cyan-500/30 text-cyan-400 shadow-[0_0_10px_rgba(0,240,255,0.2)]">
                🔔
            </button>
        </div>

        <div class="flex mb-4">
            <input type="text" id="coin-search" placeholder="Введите тикер (PEPE, TON...)" class="w-full bg-gray-800 text-white rounded-xl px-4 py-3 border border-cyan-500/30 focus:outline-none focus:border-cyan-500 uppercase placeholder-gray-500">
            <button onclick="searchCoin()" class="ml-2 bg-gradient-to-r from-cyan-500 to-blue-600 px-5 rounded-xl font-bold shadow-lg active:scale-95 transition">🔍</button>
        </div>

        <div class="flex space-x-2 overflow-x-auto pb-2 mb-4 scrollbar-hide">
            <button onclick="changeCoin('BTC', this)" class="coin-btn active px-4 py-2 rounded-xl text-sm whitespace-nowrap">BTC</button>
            <button onclick="changeCoin('ETH', this)" class="coin-btn px-4 py-2 rounded-xl text-sm whitespace-nowrap">ETH</button>
            <button onclick="changeCoin('SOL', this)" class="coin-btn px-4 py-2 rounded-xl text-sm whitespace-nowrap">SOL</button>
            <button onclick="changeCoin('XRP', this)" class="coin-btn px-4 py-2 rounded-xl text-sm whitespace-nowrap">XRP</button>
            <button onclick="changeCoin('DOGE', this)" class="coin-btn px-4 py-2 rounded-xl text-sm whitespace-nowrap">DOGE</button>
            <button onclick="changeCoin('TON', this)" class="coin-btn px-4 py-2 rounded-xl text-sm whitespace-nowrap">TON</button>
            <button onclick="changeCoin('PEPE', this)" class="coin-btn px-4 py-2 rounded-xl text-sm whitespace-nowrap">PEPE</button>
        </div>

        <div class="neon-border rounded-3xl p-4 mb-6">
            <div class="flex justify-between items-center mb-4">
                <div class="flex space-x-1 p-1 rounded-xl">
                    <button onclick="changeTimeframe('1h', this)" class="time-btn px-4 py-1.5 text-xs font-semibold rounded-lg active">1ч</button>
                    <button onclick="changeTimeframe('4h', this)" class="time-btn px-4 py-1.5 text-xs font-semibold rounded-lg">4ч</button>
                    <button onclick="changeTimeframe('1d', this)" class="time-btn px-4 py-1.5 text-xs font-semibold rounded-lg">1д</button>
                </div>
                <span class="text-xs text-cyan-300/50" id="chart-status">Загрузка...</span>
            </div>
            <div id="chart-container" class="rounded-xl overflow-hidden"></div>
        </div>

        <div class="neon-border rounded-3xl p-5 mb-6">
            <div class="flex items-center space-x-2 mb-3">
                <div class="w-2.5 h-2.5 bg-cyan-400 rounded-full ai-pulse"></div>
                <h2 class="text-lg font-bold neon-text" id="ai-title">AI Аналитика</h2>
            </div>
            <div class="text-sm text-gray-300 mb-4 leading-relaxed" id="ai-response">Нажми кнопку ниже для анализа.</div>
            <button onclick="analyzeMarket()" id="analyze-btn" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold py-3.5 px-4 rounded-2xl transition transform active:scale-95 shadow-lg">
                🧠 Запустить анализ
            </button>
        </div>
    </div>

    <!-- ================= ВКЛАДКА 2: ОПОВЕЩЕНИЯ ================= -->
    <div id="view-alerts" class="tab-content">
        <h1 class="text-2xl font-bold neon-text mb-6">🔔 Мои Оповещения</h1>
        
        <div class="neon-border rounded-3xl p-5 mb-6">
            <h2 class="text-sm font-bold text-cyan-300 mb-3">Создать новое</h2>
            <div class="flex space-x-2 mb-3">
                <input type="text" id="alert-symbol" value="BTC" class="w-1/3 bg-gray-800 text-white rounded-xl px-3 py-2 border border-cyan-500/30 uppercase text-center font-bold">
                <input type="number" id="alert-price" placeholder="Цена" class="w-2/3 bg-gray-800 text-white rounded-xl px-3 py-2 border border-cyan-500/30">
            </div>
            <div class="flex space-x-2 mb-4">
                <select id="alert-condition" class="w-full bg-gray-800 text-white rounded-xl px-3 py-2 border border-cyan-500/30 appearance-none">
                    <option value="above">📈 Цена поднимется ВЫШЕ</option>
                    <option value="below">📉 Цена опустится НИЖЕ</option>
                </select>
            </div>
            <button onclick="createAlert()" class="w-full bg-cyan-500 text-black font-bold py-3 rounded-xl active:scale-95 transition">Установить уведомление</button>
        </div>

        <h2 class="text-sm font-bold text-gray-400 mb-3">Активные уведомления</h2>
        <div id="alerts-list" class="space-y-3">
            <div class="text-center text-gray-500">Загрузка...</div>
        </div>
    </div>

    <!-- ================= ВКЛАДКА 3: ИНСТРУМЕНТЫ ================= -->
    <div id="view-tools" class="tab-content">
        <h1 class="text-2xl font-bold neon-text mb-6">🛠 Инструменты анализа</h1>
        <div class="neon-border rounded-3xl p-5 mb-4">
            <h2 class="text-lg font-bold text-white mb-2">Сводка по <span id="tools-symbol">BTC</span> (1ч)</h2>
            <div class="flex items-center justify-between bg-black/30 p-4 rounded-xl mb-3">
                <span class="text-gray-300">Общий сигнал:</span>
                <span class="text-xl font-bold text-green-400" id="tool-signal">Анализ...</span>
            </div>
            <div class="grid grid-cols-2 gap-3 text-sm">
                <div class="bg-gray-800 p-3 rounded-lg"><div class="text-gray-400 mb-1">RSI (14)</div><div class="font-bold text-white" id="tool-rsi">-</div></div>
                <div class="bg-gray-800 p-3 rounded-lg"><div class="text-gray-400 mb-1">Тренд (MA20)</div><div class="font-bold text-white" id="tool-ma">-</div></div>
            </div>
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('terminal', this)">
            <span class="nav-icon">📈</span><span>Терминал</span>
        </div>
        <div class="nav-item" onclick="switchTab('alerts', this)">
            <span class="nav-icon">🔔</span><span>Оповещения</span>
        </div>
        <div class="nav-item" onclick="switchTab('tools', this)">
            <span class="nav-icon">🛠</span><span>Инструменты</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready(); 
        
        let userId = 0; 
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
        }

        function switchTab(tabId, navElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${tabId}`).classList.add('active');
            navElement.classList.add('active');
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            
            if (tabId === 'alerts') loadAlerts();
            if (tabId === 'tools') loadToolsData();
        }

        // --- ГРАФИК ---
        const chartContainer = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartContainer, {
            width: chartContainer.clientWidth, height: 300,
            layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#00f0ff' },
            grid: { vertLines: { color: 'rgba(0, 240, 255, 0.05)' }, horzLines: { color: 'rgba(0, 240, 255, 0.05)' } },
            rightPriceScale: { borderColor: 'rgba(0, 240, 255, 0.2)', autoScale: true },
            timeScale: { borderColor: 'rgba(0, 240, 255, 0.2)' }
        });
        const candleSeries = chart.addCandlestickSeries({ upColor: '#00ff88', downColor: '#ff3366', borderVisible: false, wickUpColor: '#00ff88', wickDownColor: '#ff3366' });

        let currentInterval = '60'; 
        let currentSymbol = 'BTC';

        async function fetchCandles(interval, symbol) {
            document.getElementById('chart-status').innerText = "Загрузка...";
            try {
                const res = await fetch(`${window.location.origin}/api/candles?interval=${interval}&symbol=${symbol}`);
                const data = await res.json();
                if (data.error) { 
                    document.getElementById('chart-status').innerText = `Ошибка`; 
                    candleSeries.setData([]); return; 
                }
                const lastPrice = data.length > 0 ? data[data.length - 1].close : 0;
                let precision = lastPrice < 0.0001 ? 8 : lastPrice < 0.01 ? 6 : lastPrice < 1 ? 4 : 2;
                let minMove = lastPrice < 0.0001 ? 0.00000001 : lastPrice < 0.01 ? 0.000001 : lastPrice < 1 ? 0.0001 : 0.01;

                candleSeries.applyOptions({ priceFormat: { type: 'price', precision, minMove } });
                candleSeries.setData(data);
                chart.priceScale('right').applyOptions({ autoScale: true });
                chart.timeScale().fitContent();
                
                document.getElementById('chart-status').innerText = `Обновлено`;
                document.getElementById('current-price').innerText = `$${lastPrice.toFixed(precision).toLocaleString()}`;
            } catch (error) { document.getElementById('chart-status').innerText = "Ошибка"; }
        }

        function searchCoin() {
            const symbol = document.getElementById('coin-search').value.trim().toUpperCase();
            if (symbol) {
                document.querySelectorAll('.coin-btn').forEach(b => b.classList.remove('active'));
                updateUIForCoin(symbol);
                document.getElementById('coin-search').value = ''; 
                document.getElementById('coin-search').blur(); 
            }
        }
        document.getElementById('coin-search').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchCoin(); });

        function changeCoin(symbol, btn) {
            if(btn) {
                document.querySelectorAll('.coin-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            updateUIForCoin(symbol);
        }

        function updateUIForCoin(symbol) {
            currentSymbol = symbol;
            document.getElementById('header-symbol').innerText = `${symbol} / USD`;
            document.getElementById('ai-title').innerText = `AI Аналитика ${symbol}`;
            document.getElementById('ai-response').innerHTML = `Нажми кнопку ниже, чтобы проанализировать <b>${symbol}</b>.`;
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            fetchCandles(currentInterval, currentSymbol);
        }

        function changeTimeframe(interval, btn) {
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentInterval = interval === '1h' ? '60' : interval === '4h' ? '240' : '1440';
            fetchCandles(currentInterval, currentSymbol);
        }

        async function analyzeMarket() {
            const btn = document.getElementById('analyze-btn');
            const responseDiv = document.getElementById('ai-response');
            btn.innerText = "⏳ Анализируем..."; btn.classList.add('opacity-70');
            try {
                const response = await fetch(`${window.location.origin}/api/analyze?interval=${currentInterval}&symbol=${currentSymbol}`);
                const data = await response.json();
                responseDiv.innerHTML = data.error ? `❌ Ошибка` : data.analysis;
            } catch (error) { responseDiv.innerHTML = "❌ Ошибка сети"; } 
            finally { btn.innerText = "🧠 Запустить анализ"; btn.classList.remove('opacity-70'); }
        }

        // --- УВЕДОМЛЕНИЯ ---
        function goToCreateAlert() {
            document.getElementById('alert-symbol').value = currentSymbol;
            switchTab('alerts', document.querySelectorAll('.nav-item')[1]);
        }

        async function createAlert() {
            if (!userId) return alert("Ошибка Telegram ID");
            const symbol = document.getElementById('alert-symbol').value.trim().toUpperCase();
            const price = parseFloat(document.getElementById('alert-price').value);
            const condition = document.getElementById('alert-condition').value;

            if (!symbol || isNaN(price)) return alert("Заполните все поля!");

            try {
                const res = await fetch(`${window.location.origin}/api/alerts`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, symbol: symbol, target_price: price, condition: condition })
                });
                const data = await res.json();
                
                if (data.error) {
                    tg.showAlert("❌ " + data.error);
                    return;
                }
                
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                document.getElementById('alert-price').value = '';
                loadAlerts();
            } catch(e) { tg.showAlert("Ошибка сети"); }
        }

        async function loadAlerts() {
            const list = document.getElementById('alerts-list');
            if (!userId) { list.innerHTML = "Нет ID пользователя"; return; }
            
            try {
                const res = await fetch(`${window.location.origin}/api/alerts?user_id=${userId}`);
                const alerts = await res.json();
                
                if (alerts.length === 0) {
                    list.innerHTML = `<div class="text-center text-gray-500">У вас пока нет активных уведомлений</div>`;
                    return;
                }

                list.innerHTML = alerts.map(a => {
                    const condText = a.condition === 'above' ? '📈 Выше' : '📉 Ниже';
                    return `
                    <div class="neon-border rounded-2xl p-4 flex justify-between items-center mb-3">
                        <div>
                            <div class="font-bold text-lg text-white">${a.symbol}</div>
                            <div class="text-sm text-gray-400">${condText} $${a.target_price}</div>
                        </div>
                        <button onclick="deleteAlert(${a.id})" class="bg-red-500/20 text-red-400 px-3 py-2 rounded-lg text-sm font-bold active:scale-95 transition">Удалить</button>
                    </div>`;
                }).join('');
            } catch(e) { list.innerHTML = "Ошибка загрузки"; }
        }

        async function deleteAlert(id) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            try {
                await fetch(`${window.location.origin}/api/alerts?id=${id}`, { method: 'DELETE' });
                loadAlerts();
            } catch(e) {}
        }

        // --- ИНСТРУМЕНТЫ ---
        async function loadToolsData() {
            document.getElementById('tools-symbol').innerText = currentSymbol;
            document.getElementById('tool-signal').innerText = "Анализ...";
            try {
                const response = await fetch(`${window.location.origin}/api/analyze?interval=60&symbol=${currentSymbol}`);
                const data = await response.json();
                if(!data.error) {
                    const rsiMatch = data.analysis.match(/RSI: <b>([\d.]+)<\/b>/);
                    const maMatch = data.analysis.match(/MA: <b>([^<]+)<\/b>/);
                    if (rsiMatch) document.getElementById('tool-rsi').innerText = rsiMatch[1];
                    if (maMatch) document.getElementById('tool-ma').innerText = maMatch[1];
                    
                    const sig = document.getElementById('tool-signal');
                    if (data.analysis.includes("Бычий") || data.analysis.includes("Перепроданность")) {
                        sig.innerText = "Покупать (LONG)"; sig.className = "text-xl font-bold text-green-400";
                    } else if (data.analysis.includes("Медвежий") || data.analysis.includes("Перекупленность")) {
                        sig.innerText = "Продавать (SHORT)"; sig.className = "text-xl font-bold text-red-400";
                    } else {
                        sig.innerText = "Нейтрально"; sig.className = "text-xl font-bold text-gray-400";
                    }
                }
            } catch(e) { console.log(e); }
        }

        fetchCandles(currentInterval, currentSymbol);
    </script>
</body>
</html>
