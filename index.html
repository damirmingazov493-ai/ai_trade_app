<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Trading Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e11; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .glass-panel { background: rgba(30, 35, 41, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="p-4 pb-20">

    <!-- Шапка -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-white">BTC / USDT</h1>
            <p class="text-green-400 text-sm font-semibold">$64,230.50 <span class="text-xs">+2.4%</span></p>
        </div>
        <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center font-bold">
            <span id="user-initial">U</span>
        </div>
    </div>

    <!-- Заглушка графика (свечи) -->
    <div class="glass-panel rounded-2xl p-4 mb-6 h-64 flex flex-col justify-between">
        <div class="flex space-x-2 text-xs text-gray-400">
            <span class="bg-gray-800 px-2 py-1 rounded">15м</span>
            <span class="bg-gray-800 px-2 py-1 rounded">1ч</span>
            <span class="bg-indigo-600 text-white px-2 py-1 rounded">1д</span>
        </div>
        <div class="w-full h-32 flex items-end space-x-1 mt-4">
            <div class="bg-green-500 w-full h-[40%] rounded-t-sm"></div>
            <div class="bg-green-500 w-full h-[60%] rounded-t-sm"></div>
            <div class="bg-red-500 w-full h-[50%] rounded-t-sm"></div>
            <div class="bg-green-500 w-full h-[70%] rounded-t-sm"></div>
            <div class="bg-green-500 w-full h-[90%] rounded-t-sm"></div>
            <div class="bg-red-500 w-full h-[80%] rounded-t-sm"></div>
            <div class="bg-green-500 w-full h-[100%] rounded-t-sm"></div>
        </div>
    </div>

    <!-- Блок с ИИ -->
    <div class="glass-panel rounded-2xl p-5 mb-6">
        <div class="flex items-center space-x-2 mb-3">
            <div class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></div>
            <h2 class="text-lg font-semibold">AI Анализ</h2>
        </div>
        <p class="text-sm text-gray-400 mb-4" id="ai-response">Нажми кнопку ниже, чтобы нейросеть проанализировала текущий график и дала прогноз.</p>
        
        <button onclick="analyzeMarket()" id="analyze-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition duration-300 ease-in-out transform active:scale-95">
            🧠 Проанализировать рынок
        </button>
    </div>

    <!-- Кнопки действий -->
    <div class="grid grid-cols-2 gap-4">
        <button class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-xl text-lg transition active:scale-95 shadow-[0_0_15px_rgba(34,197,94,0.4)]">
            BUY / LONG
        </button>
        <button class="bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-xl text-lg transition active:scale-95 shadow-[0_0_15px_rgba(239,68,68,0.4)]">
            SELL / SHORT
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.ready(); 

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-initial').innerText = user.first_name.charAt(0).toUpperCase();
        }

        async function analyzeMarket() {
            const btn = document.getElementById('analyze-btn');
            const responseDiv = document.getElementById('ai-response');
            
            btn.innerText = "⏳ Анализируем...";
            btn.classList.add('opacity-50');
            responseDiv.innerHTML = "<span class='animate-pulse'>Нейросеть изучает объемы и свечи...</span>";

            try {
                const response = await fetch('/api/analyze', { method: 'POST' });
                const data = await response.json();
                responseDiv.innerHTML = data.analysis;
            } catch (error) {
                responseDiv.innerHTML = "❌ Ошибка сети. Попробуй еще раз.";
            } finally {
                btn.innerText = "🧠 Проанализировать рынок";
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
